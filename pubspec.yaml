name: merkez_muzik_ve_ritim
description: "Müzik ve Ritim merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 05acd1e648dcb04c962281272f3fb806fc9ccc99
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_gunluk_ritim:
    git:
      url: https://github.com/taktemurr-ops/oyun-gunluk-ritim
      ref: 79d2497cb6dbecdc5891d60a6fc5c8359b7d6c86
  oyun_nota_karolari:
    git:
      url: https://github.com/taktemurr-ops/oyun-nota-karolari
      ref: 1d8edfb881244950e2ca12f61b371bee9bc6a94f
  oyun_ritim_vurusu:
    git:
      url: https://github.com/taktemurr-ops/oyun-ritim-vurusu
      ref: 4ae5c465407846feaeb97c8ddb254d0870b45139
  oyun_davul_dersi:
    git:
      url: https://github.com/taktemurr-ops/oyun-davul-dersi
      ref: a59116ea4e2873ee81f3ee20015eceb1e2bea354
  oyun_ezgi_bahcesi:
    git:
      url: https://github.com/taktemurr-ops/oyun-ezgi-bahcesi
      ref: 906bdd2b62ae8a34742a4bbd7fe674ad81dfcec4
  oyun_kulak_egitimi:
    git:
      url: https://github.com/taktemurr-ops/oyun-kulak-egitimi
      ref: dcf0234145304c5a4dbaf808b4656bc1a7fedf1b
  oyun_makam_yolculugu:
    git:
      url: https://github.com/taktemurr-ops/oyun-makam-yolculugu
      ref: ede9407d73d12d159820419c6918724bd03d7939
  oyun_akort:
    git:
      url: https://github.com/taktemurr-ops/oyun-akort
      ref: f29dd479af53930489a8b5f1104d2492f89ead8e
  oyun_gitar_akorlari:
    git:
      url: https://github.com/taktemurr-ops/oyun-gitar-akorlari
      ref: 705a026c0ac65b22a11d82d108628bb02a01425a
  oyun_nota_ogrenme:
    git:
      url: https://github.com/taktemurr-ops/oyun-nota-ogrenme
      ref: a4f43fff5d511f1c9ba43bdcc2442f9c754d45ba
  oyun_melodi_hafizasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-melodi-hafizasi
      ref: 6df47a1cab2eceaf2fdd38b859c958c9eb5c2cc8
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 05acd1e648dcb04c962281272f3fb806fc9ccc99
  muzik_motoru:
    git:
      url: https://github.com/taktemurr-ops/muzik-motoru
      ref: 79f58234bfec22180e377040a16d80b9344c50d3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
