name: merkez_muzik_ve_ritim
description: "Müzik ve Ritim merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 5eedc912719ebc306e3cd9e5e9b251efe4399105
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_gunluk_ritim:
    git:
      url: https://github.com/taktemurr-ops/oyun-gunluk-ritim
      ref: a5c7e3c4227e765d4b3aa5836167885135ca78b9
  oyun_nota_karolari:
    git:
      url: https://github.com/taktemurr-ops/oyun-nota-karolari
      ref: e70929bcd2d5a3a0780a2b3826227309e9cfda62
  oyun_ritim_vurusu:
    git:
      url: https://github.com/taktemurr-ops/oyun-ritim-vurusu
      ref: 6e9f4dc274e70952ad2302e55f8a1749bc00d29c
  oyun_davul_dersi:
    git:
      url: https://github.com/taktemurr-ops/oyun-davul-dersi
      ref: c32d53c4c20d9e58511e5ea8440638c151413ba7
  oyun_ezgi_bahcesi:
    git:
      url: https://github.com/taktemurr-ops/oyun-ezgi-bahcesi
      ref: ddd38c5d772eb7518ed068f1d885ff8403c02d08
  oyun_kulak_egitimi:
    git:
      url: https://github.com/taktemurr-ops/oyun-kulak-egitimi
      ref: 4f2a3fc78aeaaf4cd70284cf4ca26e24e9f179ec
  oyun_ritim_diktesi:
    git:
      url: https://github.com/taktemurr-ops/oyun-ritim-diktesi
      ref: e2a2812aced73668932c8d4580ebbdcb007db840
  oyun_ton_tutma:
    git:
      url: https://github.com/taktemurr-ops/oyun-ton-tutma
      ref: 66629ebb560f4cae190271ebaa87543e211cb02d
  oyun_makam_yolculugu:
    git:
      url: https://github.com/taktemurr-ops/oyun-makam-yolculugu
      ref: 83e7e53b37dd8768710cb10f036ce156632ea214
  oyun_akort:
    git:
      url: https://github.com/taktemurr-ops/oyun-akort
      ref: 43655b82ff0dd2faedf1e9a47a225d1ab809831f
  oyun_gitar_akorlari:
    git:
      url: https://github.com/taktemurr-ops/oyun-gitar-akorlari
      ref: dab17ca54cfc7cbe674ea88a6861a7430a336ddb
  oyun_nota_ogrenme:
    git:
      url: https://github.com/taktemurr-ops/oyun-nota-ogrenme
      ref: f6b86415db18252380b4426776f364925f5b8346
  oyun_melodi_hafizasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-melodi-hafizasi
      ref: ab780e2e68a6d6959b4d177f4b9460ada02a0f7b
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 5eedc912719ebc306e3cd9e5e9b251efe4399105
  muzik_motoru:
    git:
      url: https://github.com/taktemurr-ops/muzik-motoru
      ref: cfc4f9d79074f8d6210db59df16324566e4910aa

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/approved/
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
